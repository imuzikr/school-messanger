<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>이음 · 교직원 계정 관리</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="server.css"><script defer src="admin-ui.js"></script></head><body><header class="titlebar"><strong>이음 · 교직원 계정 관리</strong><div><button data-window="minimize">−</button><button data-window="close">×</button></div></header><main><section id="admin-login" class="card admin-login"><h2>관리자 확인</h2><form id="admin-login-form"><label>관리자 아이디<input id="login-user" required autocomplete="username"></label><label>비밀번호<input id="login-pass" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">계정 관리 열기</button></form></section><div id="admin-workspace" hidden><div class="admin-heading"><h1>함께하는 교직원</h1><button id="refresh-users">목록 새로고침</button></div><section class="card"><div class="staff-scroll"><table class="staff-table"><thead><tr><th>이름</th><th>아이디</th><th>부서 / 직책</th><th>상태</th><th>계정 관리</th></tr></thead><tbody id="user-list"></tbody></table></div></section><section class="card admin-card"><h2>교직원 계정 추가</h2><form id="create-user-form"><div class="three"><label>이름<input id="user-name" required maxlength="40"></label><label>아이디<input id="user-username" required maxlength="40"></label><label>부서<input id="user-department" required maxlength="60" placeholder="예: 교무기획부"></label></div><div class="three"><label>직책<input id="user-role" value="교사" maxlength="30"></label><label>교과<input id="user-subject" maxlength="30"></label><label>내선 번호<input id="user-extension" maxlength="20"></label></div><div class="three"><label>학년<input id="user-grade" maxlength="30" placeholder="예: 1학년"></label><label>기타 그룹<input id="user-other-group" maxlength="60" placeholder="예: 학교행사, 업무지원"></label></div><label>임시 비밀번호<input id="user-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p class="temporary-password">임시 비밀번호는 교직원에게 별도로 안전하게 전달하세요. 첫 로그인 때 변경해야 합니다.</p><button class="primary" type="submit">계정 추가</button></form></section></div><dialog id="group-dialog"><form id="group-form"><h2>교직원 그룹 정보</h2><label>학년<input id="edit-grade" maxlength="30" placeholder="예: 1학년"></label><label>기타 그룹<input id="edit-other-group" maxlength="60" placeholder="예: 학교행사"></label><button id="group-cancel" type="button">취소</button> <button type="submit" class="primary">저장</button><p id="group-error" class="feedback"></p></form></dialog><dialog id="reset-dialog"><form id="reset-form"><h2>임시 비밀번호 다시 발급</h2><label>새 임시 비밀번호<input id="reset-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><p class="hint">첫 로그인 때 새 비밀번호로 변경하도록 안내합니다.</p><button id="reset-cancel" type="button">취소</button> <button type="submit" class="primary">초기화</button><p id="reset-error" class="feedback"></p></form></dialog><p id="feedback" class="feedback" role="status"></p></main></body></html>
