name: Verify and package duty demo
on:
  push:
    branches: [codex/duty-demo-0.2.90]
permissions:
  contents: read
defaults:
  run:
    working-directory: recovered/ieum-window-demo-0.2.7
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 fonts-noto-cjk
          python3 -m pip install openpyxl==3.1.5
          npm ci
          npm install --no-save --package-lock=false electron@44.7.0 playwright@1.56.1 pngjs@7.0.0
      - name: Unit tests and Electron flows
        run: |
          node --check js/app.js
          node --check desktop/main.cjs
          npm test
          xvfb-run -a node tests/electron-duty-manager-filter.cjs
          xvfb-run -a node tests/electron-mail-receipts.cjs
          xvfb-run -a node tests/electron-mail-receipts-lan.cjs
          xvfb-run -a node tests/electron-settings-close.cjs
          xvfb-run -a node tests/electron-memo-formatting.cjs
          xvfb-run -a node tests/electron-wings.cjs
          xvfb-run -a node tests/electron-homeroom.cjs
          xvfb-run -a node tests/electron-homeroom-lan.cjs
          xvfb-run -a node tests/electron-sticky-notes.cjs
          xvfb-run -a node tests/electron-sticky-notes-lan.cjs
          xvfb-run -a node tests/electron-duty-calendar.cjs
          xvfb-run -a node tests/electron-duty-exchanges.cjs
          xvfb-run -a node tests/electron-duty-exchanges-lan.cjs
          xvfb-run -a node tests/electron-staff-lan.cjs
          xvfb-run -a node tests/electron-staff-directory.cjs
          xvfb-run -a node tests/electron-calendar-presentation.cjs
          xvfb-run -a node tests/electron-calendar-duty-drag.cjs
          xvfb-run -a node tests/electron-title-options.cjs
          xvfb-run -a node tests/electron-ceremonies.cjs
          xvfb-run -a node tests/electron-maintenance.cjs
          xvfb-run -a node tests/electron-capture.cjs
          xvfb-run -a node tests/electron-duties.cjs
          xvfb-run -a node tests/electron-briefing.cjs
          xvfb-run -a node tests/electron-formatting.cjs
          xvfb-run -a node tests/electron-minimal.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duty-demo-screenshots
          path: recovered/ieum-window-demo-0.2.7/release/*.png
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified Electron runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/electron/electron/releases/download/v44.7.0/electron-v44.7.0-win32-x64.zip -OutFile "$env:RUNNER_TEMP/electron-v44.7.0-win32-x64.zip"
          Invoke-WebRequest https://github.com/electron/electron/releases/download/v44.7.0/SHASUMS256.txt -OutFile "$env:RUNNER_TEMP/SHASUMS256.txt"
          python scripts/build-windows-demo.py "$env:RUNNER_TEMP/electron-v44.7.0-win32-x64.zip" "$env:RUNNER_TEMP/SHASUMS256.txt"
      - name: Test packaged Windows demo
        shell: pwsh
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7.0.0
          python -m pip install openpyxl==3.1.5
          $env:IEUM_TEST_PYTHON="python"
          $env:IEUM_TEST_EXECUTABLE=(Resolve-Path "release/Ieum-Deadline-Demo-0.2.90-win-x64/Ieum-Deadline-Demo.exe").Path
          node tests/electron-mail-receipts.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-settings-close.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-memo-formatting.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-wings.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-homeroom.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-sticky-notes.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-duty-calendar.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-duty-exchanges.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-duty-manager-filter.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-staff-directory.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-calendar-presentation.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-calendar-duty-drag.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-title-options.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-ceremonies.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-maintenance.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-capture.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-duties.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/electron-briefing.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from zipfile import ZipFile; z=ZipFile('release/Ieum-Deadline-Demo-0.2.90-win-x64.zip'); assert z.testzip() is None; print('Windows ZIP CRC PASS')"
      - uses: actions/upload-artifact@v4
        with:
          name: Ieum-Demo-0.2.90
          path: recovered/ieum-window-demo-0.2.7/release/Ieum-Deadline-Demo-0.2.90-win-x64.zip
      - name: Publish tested portable demo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.2.90 release/Ieum-Deadline-Demo-0.2.90-win-x64.zip release/SHA256SUMS.txt --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "이음 Windows 데모 0.2.90" --notes "브리핑과 모달 닫기 버튼에 자동으로 생기던 굵은 초록색 포커스 테두리를 제거했습니다. 모달을 열면 대화상자 자체로 포커스를 옮기고 사용자가 선택한 내부 입력 포커스는 유지합니다. 메신저 창과 모달의 닫기 아이콘은 테두리·모서리 모양을 통일했으며, 키보드 Tab 선택 시 동일한 얇은 내부 포커스 표시를 사용합니다. 닫기 클릭·Enter·Esc 및 브리핑 이동·투명 영역을 검증했습니다. 전체 압축 해제 후 Ieum-Deadline-Demo.exe를 실행하세요."
